<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24664d" />
    <meta
      name="description"
      content="오늘 뭐 하고 놀지? 달봉이와 함께 60가지 놀이를 찾고, 뽑고, 움직이는 설명으로 배워요."
    />
    <title>달봉이의 놀이동산 · 오늘도, 같이 놀자!</title>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="header">
      <a class="brand" href="#home"
        ><img src="assets/icons/logo.svg" alt="" width="44" height="44" /><span
          >달봉이의 <strong>놀이동산</strong
          ><small>EVERY DAY IS A PLAY DAY</small></span
        ></a
      >
      <nav aria-label="주 메뉴">
        <a href="#home">놀이터 홈</a><a href="#library">놀이 도감</a
        ><a href="#pick/wheel">오늘의 뽑기</a
        ><a href="#collection">내 보물함 <span id="fav-count">0</span></a>
      </nav>
      <button
        class="icon-button"
        id="sound"
        aria-label="효과음 켜기"
        aria-pressed="false"
      >
        ♫
      </button>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading">달봉이가 놀이를 준비하고 있어요…</div>
    </main>
    <footer>
      <a class="brand" href="#home">달봉이의 놀이동산</a>
      <p>작은 놀이 하나가, 커다란 추억이 되도록.</p>
      <small>함께 정한 규칙 · 서로를 배려하는 놀이 · 매일 새로운 발견</small>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="confetti" aria-hidden="true"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
