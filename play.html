<!doctype html>
<html lang="ko" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17142f">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="혜이파파 플레이 게임 화면">
  <meta name="google-adsense-account" content="ca-pub-9168248935486215">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="play.css">
  <title>게임 | 혜이파파 플레이</title>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}</script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PDLDEKP0BB"></script>
  <script>gtag('js',new Date());gtag('config','G-PDLDEKP0BB',{anonymize_ip:true});</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9168248935486215" crossorigin="anonymous"></script>
</head>
<body>
  <header class="play-header">
    <a class="home-button" href="./" aria-label="전체 게임으로 돌아가기"><span aria-hidden="true">←</span><strong>혜이파파</strong></a>
    <div class="play-title-wrap"><span id="play-emoji" aria-hidden="true">🎮</span><div><h1 id="play-title">게임 준비 중</h1><p id="play-subtitle">잠시만 기다려 주세요</p></div></div>
    <div class="play-actions">
      <button id="favorite-game" type="button" aria-label="즐겨찾기" aria-pressed="false">♡</button>
      <button id="reload-game" type="button" aria-label="게임 새로고침">↻</button>
      <button id="fullscreen-game" type="button" aria-label="전체 화면">⛶</button>
      <button id="share-game" type="button" aria-label="게임 공유">↗</button>
    </div>
  </header>

  <main>
    <section class="game-stage" id="game-stage" aria-label="게임 실행 영역">
      <div class="loading-panel" id="loading-panel"><span aria-hidden="true">🎮</span><strong>게임을 준비하고 있어요</strong><small>화면이 나오지 않으면 새로고침 버튼을 눌러주세요.</small></div>
      <iframe id="game-frame" src="about:blank" title="게임" allow="fullscreen; autoplay" allowfullscreen></iframe>
    </section>

    <section class="play-info content-shell">
      <article class="mission-card" id="mission-card" hidden>
        <div><span class="mission-kicker">TODAY'S MISSION</span><h2>오늘의 도전을 완료했나요?</h2><p>한 판 즐겼다면 완료를 눌러 20 XP를 받아요.</p></div>
        <button id="complete-daily" type="button">✨ 도전 완료</button>
      </article>

      <div class="info-grid">
        <article class="game-about"><span class="kicker">ABOUT THIS GAME</span><h2 id="about-title">게임</h2><p id="about-description"></p><div class="meta-pills" id="about-meta"></div><div class="safe-tip"><span aria-hidden="true">💡</span><p><strong>함께 놀기 팁</strong><br><span id="about-tip">결과보다 과정을 칭찬해 주세요.</span></p></div></article>
        <aside class="session-card"><span>이번 플레이</span><strong id="session-time">00:00</strong><small>게임을 시작한 뒤 흐른 시간</small><a id="open-original" href="#">원본 화면으로 열기 ↗</a></aside>
      </div>

      <aside class="ad-section" aria-label="광고"><div class="ad-label">ADVERTISEMENT</div><ins class="adsbygoogle" style="display:block;width:100%" data-ad-client="ca-pub-9168248935486215" data-ad-slot="8180193210" data-ad-format="auto" data-full-width-responsive="true"></ins></aside>
    </section>

    <section class="recommendations content-shell" aria-labelledby="recommend-title"><div class="section-heading"><span class="kicker">NEXT PLAY</span><h2 id="recommend-title">다음에는 이 게임 어때요?</h2></div><div class="recommend-grid" id="recommend-grid"></div></section>
  </main>

  <footer><a href="./">전체 게임</a><a href="guides.html">놀이 가이드</a><a href="privacy.html">개인정보 처리방침</a></footer>
  <div class="toast" id="toast" hidden aria-live="polite"></div>
  <script src="games-data.js"></script>
  <script src="play.js" defer></script>
  <script>window.addEventListener('load',function(){try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(error){console.debug(error);}});</script>
</body>
</html>
