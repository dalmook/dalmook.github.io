name: Verify actual published wordbook
on:
  workflow_run:
    workflows: [Publish shared wordbook]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: word-published-live-check
  cancel-in-progress: false
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify anonymous actual public wordbook in both modes
        run: python dopa-word/tests/publication_live.py
      - name: Preserve real publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-publication-live-evidence
          path: qa/word-publication-live/
          retention-days: 14
