name: Tori Action 2 - integration and visual evidence
on:
  push:
    branches: [tori-action-v2, main]
    paths: ['tori-math/**', '.github/workflows/tori-action.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tori-action-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'stage payload')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate checksum-verified original source
        run: |
          python - <<'PY'
          import base64, hashlib, json, runpy, zlib
          from pathlib import Path
          root=Path('tori-math'); manifest=root/'.action-v2-package.json'
          if manifest.exists():
              meta=json.loads(manifest.read_text());parts=[]
              for part in meta['pieces']:
                  assert part['id'] in {'0','1','1tail','2a','2b','3a','3b'}
                  text=(root/('.action-v2-part'+part['id']+'.txt')).read_text().strip()[:part.get('take',999999)]
                  assert hashlib.sha256(text.encode()).hexdigest()==part['sha256']
                  parts.append(text)
              encoded=''.join(parts)
              assert hashlib.sha256(encoded.encode()).hexdigest()==meta['sha256']
              source=json.loads(zlib.decompress(base64.b64decode(encoded,validate=True)))
              assert set(source)=={'rig.mjs','scene.mjs','action-ui.mjs','action.css','audio.mjs','tests/action.py'}
              for name,text in source.items():
                  p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
              p=root/'app.mjs';p.write_text(p.read_text().replace("'./scene.mjs'","'./scene.mjs?v=2.0.0'").replace("'./audio.mjs'","'./audio.mjs?v=2.0.0'"),encoding='utf-8')
              p=root/'index.html';p.write_text(p.read_text().replace('src="./app.mjs"','src="./app.mjs?v=2.0.0"'),encoding='utf-8')
              (root/'VERSION.json').write_text(json.dumps({'version':'2.0.0','storage_schema':1,'release':'tori-action-2026-09-27'},indent=2)+'\n')
              p=root/'README.md';p.write_text(p.read_text()+'\n\n## Action 2.0\nFull-viewport action, articulated white Tori, digit-carry animation, five-phase energy, original layered music and dash/spin/crystal/meteor choreography. Maths, review, outfits and the save schema remain intact. Additional actual-browser checks: `python tests/action.py`.\n',encoding='utf-8')
              runpy.run_path(str(root/'.action-v2-fixes.py'))
          out=Path('/tmp/tori-action-qa');out.mkdir(parents=True,exist_ok=True)
          names=['index.html','style.css','app.mjs','math.mjs','scene.mjs','rig.mjs','action-ui.mjs','action.css','audio.mjs','icon.svg','tests/browser.py','tests/action.py']
          (out/'tested-source.json').write_text(json.dumps({n:(root/n).read_text() for n in names},ensure_ascii=False),encoding='utf-8')
          PY
      - name: Syntax and original mathematics/storage regression tests
        run: |
          set -o pipefail
          for file in tori-math/*.mjs; do node --check "$file"; done
          node --test tori-math/tests/math.test.mjs | tee /tmp/tori-action-qa/math-tests.log
      - name: Install browser
        id: browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Original complete-game browser regression
        env:
          QA_OUTPUT: /tmp/tori-action-qa/original
        run: |
          set -o pipefail
          python tori-math/tests/browser.py | tee /tmp/tori-action-qa/original-tests.log
      - name: Full-screen action, mobile, animation, settings and saved-game tests
        if: always() && steps.browser.outcome == 'success'
        env:
          QA_OUTPUT: /tmp/tori-action-qa/action
        run: |
          set -o pipefail
          python tori-math/tests/action.py | tee /tmp/tori-action-qa/action-tests.log
      - name: Commit only verified game files to the feature branch
        if: success() && github.ref == 'refs/heads/tori-action-v2'
        run: |
          if [ -f tori-math/.action-v2-package.json ]; then
            rm tori-math/.action-v2-part*.txt tori-math/.action-v2-package.json tori-math/.action-v2-fixes.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tori-math
            git diff --cached --quiet || git commit -m 'feat(tori): publish verified Action 2.0 stage and animated white rabbit'
            git push origin HEAD:tori-action-v2
          fi
      - name: Keep actual screenshots, recordings, metrics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tori-action-qa-${{ github.run_id }}
          path: /tmp/tori-action-qa
          retention-days: 14
