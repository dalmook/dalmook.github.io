name: Verify sustained vocabulary performance
on:
  push:
    branches: [main]
    paths: ['dopa-word/**', '.github/workflows/dopa-word-performance.yml']
  pull_request:
    paths: ['dopa-word/**', '.github/workflows/dopa-word-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: word-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit, resource bounds and unchanged original assets
        run: |
          mkdir -p qa/performance
          find dopa-word -name '*.mjs' -exec node --check {} \;
          set -o pipefail
          node --test dopa-word/tests/*.test.mjs 2>&1 | tee qa/performance/unit.log
      - name: Install browser
        run: |
          pip install -r dopa-word/tests/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Compare audible high-load baseline and optimized version
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p qa/baseline
          git archive e05ad6872d9b665984d37c1ca354ddb46879109b dopa-word | tar -x -C qa/baseline
          python dopa-word/tests/http_server.py >qa/performance/http.log 2>&1 &
          sleep 1
          python dopa-word/tests/performance_browser.py
      - name: Verify original choice arms and score behavior remain
        if: github.ref != 'refs/heads/main'
        env:
          WORD_OUT: qa/performance/arms
        run: python dopa-word/tests/choice_arm_browser.py
      - name: Wait for exact public performance revision
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import pathlib,time,urllib.request
          names=('app.mjs','scene.mjs','audio-session.mjs','voice-pool.mjs','render-budget.mjs','index.html','choice-motion.mjs','choice-motion.css','word.css')
          expected={n:pathlib.Path('dopa-word',n).read_bytes() for n in names}
          for i in range(30):
            try:
              if all(urllib.request.urlopen('https://dalmook.github.io/dopa-word/'+n+'?verify='+str(time.time()),timeout=20).read()==b for n,b in expected.items()):break
            except Exception as e: print(e)
            time.sleep(10)
          else: raise SystemExit('Public revision mismatch')
          print('All nine public files match')
          PY
      - name: Public audible high-load verification
        if: github.ref == 'refs/heads/main'
        env:
          WORD_URL: https://dalmook.github.io/dopa-word/
          PERF_OUT: qa/performance-live
          PERF_SKIP_BASE: '1'
        run: python dopa-word/tests/performance_browser.py
      - name: Preserve measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-performance-evidence
          path: |
            qa/performance/
            qa/performance-live/
            dopa-word/
          retention-days: 14
