name: Stage vocabulary sharing source
on:
  push:
    branches: [feat/dopa-word-sharing]
    paths: [.github/word-sharing-stage.py, .github/workflows/word-sharing-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact-base vocabulary changes and verify
        run: |
          sed -i 's@Dz/KnuzyzY8zs7u@Dz/KnuzyzYzs7u@g;s@Id3Rturqt@Id3Rkurqt@g;s@pa1SdDcF8@pa1SDcF8@g' .github/word-sharing-stage.py
          python .github/word-sharing-stage.py
          node --test dopa-word/tests/*.test.mjs
      - name: Commit generated source to feature branch only
        run: |
          git add dopa-word
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(word): apply verified public-sharing integration'
          git push origin HEAD:feat/dopa-word-sharing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-sharing-stage-debug
          path: |
            .github/word-sharing-stage.py
            dopa-word/
          retention-days: 2
