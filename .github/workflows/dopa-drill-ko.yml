name: Dopa Drill Korean build
on:
  push:
    branches: [feat/dopa-drill-ko, main]
    paths:
      - '.github/workflows/dopa-drill-ko.yml'
      - 'tools/dopa-drill/**'
      - 'dopa-drill/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dopa-drill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: grmchn/dopa-drill
          ref: 0720ddfe37334628bab61ba5b3a9282bd6bfb31c
          path: _dopa_upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild Korean game from pinned upstream
        run: python tools/dopa-drill/build.py _dopa_upstream /tmp/dopa-ko
      - name: Unit tests
        run: |
          mkdir -p qa-output
          cd /tmp/dopa-ko
          node --test tests/*.test.mjs | tee "$GITHUB_WORKSPACE/qa-output/unit-tests.log"
      - name: Commit generated Korean files to feature branch
        if: github.ref == 'refs/heads/feat/dopa-drill-ko'
        run: |
          mkdir -p dopa-drill
          cp -R /tmp/dopa-ko/app/. dopa-drill/
          git add -- dopa-drill
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish complete Korean Dopa Drill with original game engine'
            git push origin HEAD:feat/dopa-drill-ko
          fi
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Play through mobile and desktop flows
        env:
          QA_OUTPUT: qa-output
        run: python tools/dopa-drill/smoke.py /tmp/dopa-ko/app | tee qa-output/browser-tests.log
      - name: Retain test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dopa-korean-qa
          path: qa-output
          retention-days: 7
      - name: Retain standalone playable source without bundled fonts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dopa-korean
          path: /tmp/dopa-ko/app
          include-hidden-files: true
          retention-days: 7
