name: Publish shared wordbook
on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing owner-created [단어공개] issue number'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: word-publication-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[단어공개]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate owner and publish word data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dopa-word/scripts/publish-shared.mjs
